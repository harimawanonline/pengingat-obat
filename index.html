<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengingat Minum Obat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7e0c4; /* Warna latar belakang seperti gambar */
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            background-color: #ff5757;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            font-size: 1.2em;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #007bff; /* Warna teks biru */
            font-weight: bold;
        }
        input[type="number"], input[type="time"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100px;
            text-align: center;
        }
        .result {
            margin-top: 20px;
            border-top: 2px solid #007bff;
            padding-top: 15px;
        }
        .result p {
            margin: 10px 0;
            color: #007bff;
        }
        .next-time {
            font-weight: normal;
            float: right;
            color: black;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PENGINGAT MINUM/TETES OBAT</h1>

    <div class="input-group">
        <label for="doses">SEHARI BERAPA KALI :</label>
        <input type="number" id="doses" value="4" min="2" onchange="calculateTimes()">
    </div>

    <div class="input-group">
        <label for="start_time">DIMULAI JAM BERAPA :</label>
        <input type="time" id="start_time" value="05:00" onchange="calculateTimes()">
    </div>

    <div class="input-group">
        <label for="end_time">DIAKHIRI JAM BERAPA :</label>
        <input type="time" id="end_time" value="20:00" onchange="calculateTimes()">
    </div>

    <div class="result" id="result_times">
        </div>

    <button onclick="calculateTimes()">Hitung Waktu</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', calculateTimes);

    function timeToMinutes(timeStr) {
        const [hours, minutes] = timeStr.split(':').map(Number);
        return hours * 60 + minutes;
    }

    function minutesToTime(totalMinutes) {
        const hours = Math.floor(totalMinutes / 60) % 24;
        const minutes = totalMinutes % 60;
        
        // Format ke HH:MM (misalnya 5 menjadi 05)
        const format = (num) => String(num).padStart(2, '0');

        return `${format(hours)}:${format(minutes)}`;
    }

    function calculateTimes() {
        const N = parseInt(document.getElementById('doses').value);
        const T_start_str = document.getElementById('start_time').value;
        const T_end_str = document.getElementById('end_time').value;

        const T_start_min = timeToMinutes(T_start_str);
        const T_end_min = timeToMinutes(T_end_str);

        const resultDiv = document.getElementById('result_times');
        resultDiv.innerHTML = '';

        // Validasi Dasar
        if (N < 2 || T_end_min <= T_start_min) {
            resultDiv.innerHTML = '<p style="color: red;">Input tidak valid. Jumlah dosis minimal 2 dan Waktu Akhir harus setelah Waktu Mulai.</p>';
            return;
        }

        // --- 1. Logika Perhitungan ---
        const totalDuration = T_end_min - T_start_min; // 1200 - 300 = 900 menit
        const intervals = N - 1; // 4 - 1 = 3 interval
        
        // Jeda waktu per interval (dalam menit)
        const delta_t = Math.round(totalDuration / intervals); // 900 / 3 = 300 menit (5 jam)

        let currentMinutes = T_start_min;
        let outputHTML = '';
        
        // Mulai dari dosis ke-2 hingga dosis ke-N
        for (let i = 1; i < N; i++) {
            currentMinutes += delta_t;
            
            // Pastikan waktu terakhir tetap T_end_str (untuk menghindari kesalahan pembulatan)
            const nextTime = (i === intervals) ? T_end_str : minutesToTime(currentMinutes);

            outputHTML += `<p>WAKTU BERIKUTNYA : <span class="next-time">${nextTime}</span></p>`;
        }
        // --- Akhir Logika Perhitungan ---

        resultDiv.innerHTML = outputHTML;
    }
</script>

</body>
</html>
